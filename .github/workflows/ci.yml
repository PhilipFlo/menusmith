name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests use our synthetic fixture sites and recorded model responses —
      # no API keys and no network to real restaurants needed.
      - run: npm test
        env:
          MENUSMITH_LLM: replay
      - run: npm run build
